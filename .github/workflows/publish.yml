name: Publish

on:
  push:
    branches: [main]
    paths: [php-repo-matrix.php]
  # Dispatched every 5 minutes by an external cron job; GitHub's own
  # schedule never fired reliably.
  workflow_dispatch:
    inputs:
      full:
        description: Full run, even when no repository changed
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time; a delayed run waits instead of racing the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # deleting superseded caches
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          coverage: none
          tools: none

      # The newest cache from any earlier run: the downloaded indexes and
      # source packages, and the InRelease files of the last full run.
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/php-repo-matrix-cache
          key: matrix-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: matrix-cache-

      # Dispatched runs stop after the InRelease files unless a repository
      # changed or the last full run is an hour old (sweep_interval).
      - id: build
        run: |
          mkdir _site
          args=(--no-publish --output=_site/index.html)
          if [ "$IF_CHANGED" = true ]; then args+=(--if-changed); fi
          php php-repo-matrix.php "${args[@]}"
          if [ -f _site/index.html ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
        env:
          IF_CHANGED: ${{ github.event_name == 'workflow_dispatch' && !inputs.full }}
          # sys_get_temp_dir(), so the script's cache lands in the cached path.
          TMPDIR: ${{ runner.temp }}

      # Saved after every full run, so the next one compares against it.
      - if: steps.build.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/php-repo-matrix-cache
          key: matrix-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.build.outputs.changed == 'true'
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key matrix-cache- --limit 100 --json key --jq '.[].key' \
            | grep -vxF "$KEY" | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" || true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: matrix-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
