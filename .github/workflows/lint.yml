name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: cs2pr
      - run: php -l php-repo-matrix.php
      - uses: ramsey/composer-install@v3
      # Checkstyle output becomes inline annotations on the pull request.
      - run: vendor/bin/phpcs -q --no-cache --report=checkstyle | cs2pr
        shell: bash
